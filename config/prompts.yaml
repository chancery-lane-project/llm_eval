# TCLP Semantic Benchmark - Challenging Test Prompts
# Designed to test Semantic Web (JSON-LD) retrieval capabilities
# Derived from specific clause data in the TCLP library

prompts:
  # ------------------------------------------------------------------
  # Category 1: Status & Validity (The "Dead or Alive" Filter)
  # Tests: schema:creativeWorkStatus, schema:dateModified
  # ------------------------------------------------------------------
  status_checks:
    - id: stat_001
      text: "Go to chancerylaneproject.org and check the current status of 'Evie's Clause' (Debt Finance). Is it marked as 'Actively Maintained', or has it been archived? If archived, what sector was it originally designed for?"
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["schema:creativeWorkStatus", "schema:industry"]
      expected_concepts:
        - "Not Maintained"
        - "Energy and natural resources"

    - id: stat_002
      text: "I need a due diligence questionnaire for a German M&A transaction. Search chancerylaneproject.org for 'Lisa-Marie's LDDQ' and confirm if it is valid for 'Deutschland' and what its current maintenance status is."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["jurisdiction_mapping", "maintenance_status"]
      expected_concepts:
        - "Deutschland"
        - "Not Maintained"
        - "Corporate ESG LDD-Questionnaire"

    - id: stat_003
      text: "Compare the status of 'Raphael’s Procurement DDQ' and 'Augie’s Procurement DDQ' on chancerylaneproject.org. Which one is currently 'Maintained' and applicable to 'England & Wales'?"
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["entity_comparison", "jurisdiction_filter"]
      expected_concepts:
        - "Raphael’s Procurement DDQ"
        - "Maintained"
        - "England & Wales"

  # ------------------------------------------------------------------
  # Category 2: The "Venn Diagram" (Complex Intersections)
  # Tests: Practice Area + Sector + Topic intersections
  # ------------------------------------------------------------------
  multi_dimensional:
    - id: md_001
      text: "Consult chancerylaneproject.org to find a clause suitable for 'Construction' that specifically deals with 'Modern Methods of Construction (MMC)'. Does it have a 'Net Zero' objective?"
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["practice_area_mapping", "objective_tagging"]
      expected_concepts:
        - "Madhavi's Clause"
        - "Net Zero Objectives"
        - "Construction"

    - id: md_002
      text: "Search The Chancery Lane Project for 'Supply Chain' clauses. Filter this list to find a questionnaire that specifically addresses 'Food Waste' and is suitable for the 'Consumer Goods' sector."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["sector_filtering", "practice_area_filtering"]
      expected_concepts:
        - "Antonio's Clause"
        - "Runa's Clause"
        - "Consumer goods, services and retail"

    - id: md_003
      text: "Using chancerylaneproject.org, find me a 'Banking and Finance' clause that introduces an 'interest ratchet' based on 'carbon saving' for use in England & Wales."
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["mechanism_identification", "jurisdiction_match"]
      expected_concepts:
        - "Laith and Irsa's Clause"
        - "Interest Ratchet"
        - "Banking and finance"

    - id: md_004
      text: "Find clauses on chancerylaneproject.org that are tagged for 'Real Estate' AND specifically deal with 'Green Leases' in 'Ireland'."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["jurisdiction_grouping", "practice_area_filtering"]
      expected_concepts:
        - "Amélie and Lauri’s Clause"
        - "Emily and Tom’s Clause"
        - "Odhran’s Clause"
        - "Ireland"

  # ------------------------------------------------------------------
  # Category 3: Relationships (Parents, Children, & Variants)
  # Tests: schema:hasPart, schema:isBasedOn, schema:relatedLink
  # ------------------------------------------------------------------
  relationship_traversal:
    - id: rel_001
      text: "Look up 'Net Zero Culture Employment Handbook' on chancerylaneproject.org. Does this handbook contain a specific section or 'child clause' regarding 'Sustainable Business Travel'?"
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["schema:hasPart", "content_structure"]
      expected_concepts:
        - "Elliot's Handbook"
        - "Expenses policy"
        - "Sustainable business travel"

    - id: rel_002
      text: "I'm looking at 'The Net Zero Standard for Suppliers'. Is this a standalone clause, or is it related to/derived from other supply chain clauses like 'Jessica's Clause'?"
      expected_tclp_mention: true
      difficulty: very_hard
      semantic_features: ["schema:isBasedOn", "schema:relatedLink"]
      expected_concepts:
        - "Matilda's Annex"
        - "Consolidated version"
        - "Jessica's Clause"

    - id: rel_003
      text: "On chancerylaneproject.org, are there any 'transposition' or 'variant' clauses of 'Connor's Clause' (Insurance) that apply to the 'Built Environment' or 'Real Estate'?"
      expected_tclp_mention: true
      difficulty: very_hard
      semantic_features: ["functional_similarity", "cross_sector_mapping"]
      expected_concepts:
        - "Millie's Clause"
        - "Insurance incentives"

  # ------------------------------------------------------------------
  # Category 4: Standards & External Compliance
  # Tests: dcterms:conformsTo, standard_reference
  # ------------------------------------------------------------------
  standards_linkage:
    - id: std_001
      text: "Which clauses on chancerylaneproject.org explicitly reference the 'GHG Protocol' for measuring scope 1, 2, and 3 emissions?"
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["standard_citation", "term_extraction"]
      expected_concepts:
        - "Sarah's Clause"
        - "Matteo's Clause"
        - "Ming's Clause"
        - "GHG Protocol"

    - id: std_002
      text: "Search chancerylaneproject.org for clauses that align with the 'Science Based Targets initiative' (SBTi). Specifically, find a 'Board Minute' precedent that uses this standard."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["document_type_filter", "standard_mapping"]
      expected_concepts:
        - "Darcy's Board Minutes"
        - "SBTi"
        - "Science Based Targets"

    - id: std_003
      text: "Do you have a clause that aligns with the 'Task Force on Climate-related Financial Disclosures' (TCFD) recommendations for use in 'Investment' agreements?"
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["standard_mapping", "practice_area_intersection"]
      expected_concepts:
        - "Hugo's Clause"
        - "Frank's Clause"
        - "TCFD"

  # ------------------------------------------------------------------
  # Category 5: "Fuzzy" Intent & Concept Mapping
  # Tests: skos:altLabel, intent_resolution
  # ------------------------------------------------------------------
  concept_mapping:
    - id: con_001
      text: "I want to prevent 'greenwashing' in my supply chain. Which specific due diligence questionnaires on chancerylaneproject.org help uncover this?"
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["skos:altLabel", "intent_resolution"]
      expected_concepts:
        - "Gordon's DDQ"
        - "Raphael's Procurement DDQ"
        - "Greenwashing claims"

    - id: con_002
      text: "Search chancerylaneproject.org for clauses that promote a 'Just Transition' in the context of 'Renewable Energy' supply chains."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["theme_mapping", "social_tagging"]
      expected_concepts:
        - "Miko's Clause"
        - "Ayshe's Clause"
        - "Just Transition"

    - id: con_003
      text: "I need a clause that acts as a 'carrot' rather than a 'stick' for suppliers to reduce emissions. What do you suggest?"
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["mechanism_classification", "incentive_vs_penalty"]
      expected_concepts:
        - "Jess and Rory's Clause"
        - "Zeela's Clause"
        - "Gain-share"
        - "Incentive"

  # ------------------------------------------------------------------
  # Category 6: Logic & Negative Constraints
  # Tests: Exclusion logic, Jurisdiction checks
  # ------------------------------------------------------------------
  logic_puzzles:
    - id: log_001
      text: "List all clauses on chancerylaneproject.org that are applicable to 'USA' jurisdiction but are NOT 'Procurement' clauses."
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["negative_filtering", "jurisdiction_check"]
      expected_concepts:
        - "Sam's Clause"
        - "Willow's Clause"
        - "Real Estate"
        - "Construction"

    - id: log_002
      text: "Find the 'Green Lease' clauses for 'Ireland'. Are there any *other* than 'Odhran's Clause'?"
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["set_retrieval", "exclusion_logic"]
      expected_concepts:
        - "Amélie and Lauri’s Clause"
        - "Emily and Tom’s Clause"

    - id: log_003
      text: "Which clauses allow for 'Termination' of a contract specifically for environmental reasons? I need the 'Short Form' version."
      expected_tclp_mention: true
      difficulty: medium
      semantic_features: ["mechanism_filter", "form_type_match"]
      expected_concepts:
        - "Annie's Clause"
        - "Claudia's Clause"
        - "Termination"

    - id: log_004
      text: "Compare 'Raphael's DDQ' and 'Lola and Harry's DDQ'. Which one is designed for 'Supply Chain' vs 'M&A'?"
      expected_tclp_mention: true
      difficulty: hard
      semantic_features: ["entity_comparison", "practice_area_distinction"]
      expected_concepts:
        - "Raphael's Procurement DDQ"
        - "Lola and Harry's DDQ"
        - "Supply chain"
        - "Corporate M&A"