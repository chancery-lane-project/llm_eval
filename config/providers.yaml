# LLM provider configurations
openai:
  enabled: true
  models:
    - name: gpt-4o
      max_tokens: 1000
      temperature: 0.1
    - name: gpt-4o-mini
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 150000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

anthropic:
  enabled: true
  models:
    - name: claude-3-7-sonnet-20250219
      max_tokens: 1000
      temperature: 0.1
    - name: claude-3-5-haiku-20241022
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 100000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

gemini:
  enabled: true
  models:
    - name: gemini-2.0-flash
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 60
    tokens_per_minute: 200000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60
