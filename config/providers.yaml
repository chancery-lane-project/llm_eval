# LLM provider configurations
openrouter:
  enabled: true
  models:
    - name: openai/gpt-4-turbo:online
      max_tokens: 1000
      temperature: 0.1
    - name: openai/gpt-3.5-turbo:online
      max_tokens: 1000
      temperature: 0.1
    - name: anthropic/claude-3.5-sonnet:online
      max_tokens: 1000
      temperature: 0.1
    - name: anthropic/claude-3-haiku:online
      max_tokens: 1000
      temperature: 0.1
    - name: google/gemini-2.0-flash-exp:online
      max_tokens: 1000
      temperature: 0.1
    - name: google/gemini-pro:online
      max_tokens: 1000
      temperature: 0.1
    - name: google/gemini-1.5-pro:online
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 150000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60
