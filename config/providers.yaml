# LLM provider configurations
openai:
  enabled: true
  models:
    - name: gpt-4-turbo
      max_tokens: 1000
      temperature: 0.1
    - name: gpt-3.5-turbo
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 150000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

anthropic:
  enabled: true
  models:
    - name: claude-3-7-sonnet-20250219
      max_tokens: 1000
      temperature: 0.1
    - name: claude-3-5-haiku-20241022
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 100000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

gemini:
  enabled: true
  models:
    - name: gemini-2.0-flash-exp
      max_tokens: 1000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 6
    tokens_per_minute: 200000
    delay_between_requests: 10
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

openrouter:
  enabled: true
  api_endpoint: "https://openrouter.ai/api/v1/chat/completions"
  models:
    - "anthropic/claude-opus-4.8:online"
    - "openai/gpt-5.5:online"
    - "google/gemini-3.5-flash:online"
  max_tokens: 5000
  temperature: 0.1
  web_search:
    enabled: true
    max_results: 5
    custom_search_prompt: "Search chancerylaneproject.org for legal clauses matching this query. Include exact clause names, maintenance status (schema:creativeWorkStatus), jurisdiction, practice area, and any semantic relationships (parent clauses via schema:hasPart, variants via schema:isBasedOn, related standards like SBTi or GHG Protocol)."
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 100000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60

mcp:
  enabled: true
  api_endpoint: "https://openrouter.ai/api/v1/chat/completions"
  # MCP server URL/token are read from env (TCLP_MCP_URL / TCLP_MCP_TOKEN) — not stored here.
  max_tool_iterations: 8
  models:
    - name: "anthropic/claude-opus-4.8"
      max_tokens: 5000
      temperature: 0.1
    - name: "openai/gpt-5.5"
      max_tokens: 5000
      temperature: 0.1
    - name: "google/gemini-3.5-flash"
      max_tokens: 5000
      temperature: 0.1
  rate_limit:
    requests_per_minute: 50
    tokens_per_minute: 100000
  retry:
    max_attempts: 3
    exponential_base: 2
    max_wait_seconds: 60
